<!doctype html>
<meta charset="utf-8"/>
<title>Memory Tuner</title>
<style>
  body{font:14px system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:24px;max-width:900px}
  code{background:#f5f5f5;padding:2px 6px;border-radius:4px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .box{border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:12px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:6px}
</style>
<h2>Memory Tuner</h2>
<div class="row">
  <label>conv_id <input id="cid" value="conv-demo" /></label>
  <label>model <input id="model" value="o200k_base" /></label>
  <label>k <input id="k" type="number" min="1" max="20" value="6"/></label>
  <button id="run">Plan</button>
</div>
<div class="box">
  <div class="kv">
    <div>MEMORY_EF_TOP_K</div><div><code id="efk"></code></div>
    <div>MEMORY_EF_TEMPERATURE</div><div><code id="eft"></code></div>
    <div>MEMORY_EF_LAMBDA</div><div><code id="efl"></code></div>
    <div>MEMORY_EF_DECAY_HALF_LIFE_TURNS</div><div><code id="half"></code></div>
    <div>MEMORY_INJECT_BUDGET_TOKENS</div><div><code id="budget"></code></div>
    <div>MEMORY_DREAMS_ENABLED / RATE</div><div><code id="dreams"></code></div>
  </div>
</div>
<div id="log" class="box mono"></div>
<script>
  async function loadEnv() {
    try {
      const r = await fetch('/config/snapshot');
      const j = await r.json();
      const e = (j && j.config && j.config.env) || process.env || {};
      document.getElementById('efk').textContent = e.MEMORY_EF_TOP_K ?? '8';
      document.getElementById('eft').textContent = e.MEMORY_EF_TEMPERATURE ?? '0.7';
      document.getElementById('efl').textContent = e.MEMORY_EF_LAMBDA ?? '0.75';
      document.getElementById('half').textContent = e.MEMORY_EF_DECAY_HALF_LIFE_TURNS ?? '24';
      document.getElementById('budget').textContent = e.MEMORY_INJECT_BUDGET_TOKENS ?? '120';
      document.getElementById('dreams').textContent = (e.MEMORY_DREAMS_ENABLED ?? '0') + ' / ' + (e.MEMORY_DREAMS_RATE ?? '0.25');
    } catch {}
  }
  loadEnv();
  function log(s){ const el = document.getElementById('log'); el.textContent += s + "\n"; el.scrollTop=el.scrollHeight; }
  document.getElementById('run').onclick = () => {
    document.getElementById('log').textContent = '';
    const cid = encodeURIComponent(document.getElementById('cid').value);
    const model = encodeURIComponent(document.getElementById('model').value);
    const k = encodeURIComponent(document.getElementById('k').value);
    const es = new EventSource(`/memory/plan?conv_id=${cid}&model=${model}&k=${k}`);
    es.addEventListener('start', e => log('[start] ' + e.data));
    es.addEventListener('plan', e => log('[plan]  ' + e.data));
    es.addEventListener('end', e => { log('[end]   ' + e.data); es.close(); });
    es.addEventListener('error', e => { log('[error] ' + (e.data || '')); es.close(); });
  };
</script>
