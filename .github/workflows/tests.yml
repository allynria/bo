name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & Integration Tests (with coverage)
        env:
          TEST_TIMEOUT_MS: '60000'
        run: npm run test -- --coverage --ci
      - name: Coverage Thresholds
        run: npm run coverage:check
      - name: Dependency Audit
        run: |
          if command -v pnpm >/dev/null; then pnpm audit --audit-level=high;
          elif command -v npm >/dev/null; then npm audit --audit-level=high;
          else yarn audit --level high; fi

  redis-lock-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Redis lock test
        env:
          RUN_IDEMPOTENCY_REDIS_LOCK_TESTS: '1'
          IDEMPOTENCY_REDIS_URL: 'redis://localhost:6379'
          TEST_TIMEOUT_MS: '60000'
        run: npm test
