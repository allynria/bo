name: repo-guards
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run repo guards
        run: |
          chmod +x scripts/repo-guards.sh
          scripts/repo-guards.sh
